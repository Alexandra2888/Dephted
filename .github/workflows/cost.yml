name: cost

# Batch cost aggregation on a schedule (serving stays serving, batch stays batch). Reports the
# weekly spend rollup and fails the run if cost-per-session drifts over the alert threshold —
# an early signal of loops or prompt bloat, before the per-session guardrail ceiling trips.
on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch: # allow manual runs

jobs:
  aggregate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Aggregate cost events (alert on drift)
        env:
          # Reuse the existing repo secret; the app reads it as DATABASE_URL (config.py).
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: uv run python -m evals.aggregate_online --since 7 --alert
