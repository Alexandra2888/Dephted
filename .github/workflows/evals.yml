name: evals

# Gate on changes that can move agent behavior: prompts, graph wiring, agents, scorers.
on:
  pull_request:
    paths:
      - "server/prompts/**"
      - "server/graph.py"
      - "server/agents/**"
      - "server/evals/**"
      - "server/guards/**"
      - "server/config.py"

jobs:
  evals:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # Two gates in one run: deterministic anchors (hard, --anchor-threshold, must be 1.0
      # — a broken path fails the build) and the LLM judges (soft regression guard at 0.6).
      - name: Run eval suite
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run python -m evals.run --threshold 0.6 --anchor-threshold 1.0

  # Separate job (not a step) so the adversarial report always runs, independent of the
  # pedagogy suite's result.
  adversarial:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # Prints a per-category defended-rate table on every PR that can move agent behavior.
      # Categories in HARD_CATEGORIES fail the build; today those are the four Phase 2 closed
      # deterministically: verdict_injection, feedback_injection, empty_input, very_long_input.
      # The still-model-held categories (prompt_leak, scope_abuse, topic_injection) stay
      # report-only — promote one to blocking by editing that constant in
      # server/evals/adversarial.py once a guard makes it deterministic and its baseline is green.
      - name: Run adversarial suite (soft gate)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run python -m evals.adversarial --threshold 1.0
